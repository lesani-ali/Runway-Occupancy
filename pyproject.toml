[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-track"
version = "0.1.0"
requires-python = ">=3.12"
authors = [
    {name = "Ali Lesani"}
]
readme = "README.md"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torchmetrics[detection]>=1.0",

    "opencv-python",
    "numpy",
    "sahi==0.11.36",

    "matplotlib",
    "imageio[ffmpeg]",

    "pyyaml",
    "pydantic",
    "click",
    "rich",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4"
]
yolo = [
    "ultralytics>=8.1"
]

[project.scripts]
air-track = "air_track.pipeline.cli:run"
air-track-train = "air_track.training.cli:train"
mkv2mp4 = "air_track.utils.mkv2mp4:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 80
target-version = "py310"