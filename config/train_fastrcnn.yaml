# Faster R-CNN fine-tuning config.  Run with:  air-track-train -c config/train_fastrcnn.yaml
#
# The dataset must be in YOLO detection format (images/ + labels/ + data.yaml).
# Class count and names are read from the data.yaml.
# For YOLO training first install support:  pip install -e ".[yolo]"

# ---- YOLO-format data ----
data_yaml: "./data/model_train/NavCanada-final3/data.yaml"   # train/val image dirs + class names

# ---- Which detector to fine-tune ----
family: "torchvision"                 
weights: "fasterrcnn_resnet50_fpn"
device: "cuda:0"

# ---- Training schedule ----
epochs: 50
batch_size: 4
lr: 0.005             
momentum: 0.9         
weight_decay: 0.0005  
grad_clip_norm: null   # cap the gradient norm so one bad batch can't blow up the weights
lr_step_size: 35       # torchvision (StepLR) — one 10x drop late in training
lr_gamma: 0.1          # torchvision (StepLR)
warmup_epochs: 3       # linear LR ramp from 0.1% of lr (matches YOLO's 3 warmup epochs)
workers: 4
seed: 0

# ---- Augmentation ----
hflip_prob: 0.5        # random horizontal flip (train split only)

# ---- Anchors ----
# One RPN anchor size per FPN level (P2-P6).
anchor_sizes: [16, 32, 64, 128, 256]
# Aspect ratios (h/w).
anchor_aspect_ratios: [0.33, 0.5, 1.0]

# ---- Output ----
output_dir: "runs"
run_name: "Fast-RCNN6"
