# Video sampling
video:
  frame_stride: 4            # process every Nth frame
  max_frames: null           # debug cap (null = no limit)

# Model
model:
  family: "torchvision"      # "torchvision" or "ultralytics"
  checkpoint: "fasterrcnn_resnet50_fpn"
  device: "cuda:0"
  conf: 0.3                  # base detection confidence (pre-filter)

  # SAHI slicing
  use_sahi: true
  slice_width: 650
  slice_height: 650
  overlap_ratio: 0.2

  # Airplane class ids (COCO: airplane = 5); For YOLO pretrained on COCO, use 4. For a model fine-tuned on your single "aircraft" class, usually 0.
  airplane_class_ids: [5]

# Region of Interest
roi:
  polygon:                   # null = full frame; list of [x,y] points = polygon
    - [774, 0]
    - [872, 893]
    - [1027, 885]
    - [1176, 878]
    - [1414, 867]
    - [1700, 857]
    - [1991, 849]
    - [2305, 841]
    - [2539, 838]
    - [2968, 835]
    - [3468, 840]
    - [3893, 849]
    - [4404, 863]
    - [4511, 869]
    - [4618, 878]
    - [4716, 888]
    - [4779, 898]
    - [5131, 917]
    - [5114, 912]
    - [5107, 907]
    - [5118, 904]
    - [5194, 904]
    - [5268, 905]
    - [5348, 910]
    - [5446, 915]
    - [5788, 935]
    - [6153, 959]
    - [6402, 974]
    - [6615, 990]
    - [6718, 996]
    - [6834, 1004]
    - [6961, 1013]
