# Video sampling
video:
  frame_stride: 4            # process every Nth frame
  max_frames: null           # debug cap (null = no limit)

# Model
model:
  family: "torchvision"      # "torchvision" or "ultralytics"
  checkpoint: "./runs/Fast-RCNN2/best.pt"
  device: "cuda:0"
  conf: 0.85                  # base detection confidence (pre-filter)

  # SAHI slicing
  use_sahi: true
  slice_width: 640
  slice_height: 640
  overlap_ratio: 0.2

  # Airplane class ids (COCO: airplane = 5); For YOLO pretrained on COCO, use 4. For a model fine-tuned on your single "aircraft" class, usually 0.
  airplane_class_ids: [1]

# Region of Interest
