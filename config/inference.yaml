  mask_frame: false          # if true, zero-out pixels outside ROI before detection

# Multi-object tracking (any tracker in air_track/tracking/<name>.py)
tracking:
  tracker: "bytetrack"
  params:                      # passed as-is to the tracker (sv.ByteTrack)
    track_activation_threshold: 0.8 
    lost_track_buffer: 60      # in 30-fps frames (30 = 1 s), rescaled to the sampled rate
    minimum_matching_threshold: 0.8
    minimum_consecutive_frames: 3
  stitch_max_gap_sec: 3.0      # re-join a track that ends with one starting within this gap...
  stitch_max_dist_ratio: 3.0   # ...and within this many box widths of where it ended

# Runway occupancy time (ROT) extraction
rot:
  ref_point: "bottom"          # box point tested against the ROI: "bottom" or "center"
  air_height_ratio: 2.0        # airspace above the ROI counted as "over the runway", in aircraft box heights
  min_run_frames: 3            # zone must hold this many sampled frames to count
  max_off_gap_sec: 2.0         # OFF gaps this short inside a track do not split an episode
  min_track_frames: 32         # shorter tracks are dropped
  min_displacement_px: 100     # tracks that move less are dropped (parked aircraft)

# Outputs
outputs:
  output_dir: "./data/rot/outputs/"
  save_csv: true             # episodes.csv
  save_plot: true            # occupancy.png
  save_img: true
  hide_conf: false
  generate_video: true

# Evaluation
evaluation:
  iou_threshold: 0.5

# Logging
logging:
  level: "INFO"              # DEBUG, INFO, WARNING, ERROR
  log_file: null             # path to log file (null = console only)
  verbose: false             # verbose logging (enables DEBUG-level output)